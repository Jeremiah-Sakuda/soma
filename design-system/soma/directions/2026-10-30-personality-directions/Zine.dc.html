<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Soma · Riso zine</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Black&amp;family=Archivo:wght@400;500;600;700&amp;family=Courier+Prime:wght@400;700&amp;display=swap">
<style>
body{margin:0}
a{color:#3255A4}a:hover{color:#1E1B4B}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
input::placeholder{color:#5C6FA8}
</style>
</helmet>
<div style="position: relative; width: 1280px; height: 800px; box-sizing: border-box; background: #F1EEE6; color: #3255A4; font-family: 'Archivo', system-ui, sans-serif; overflow: hidden">

<header style="position: absolute; left: 48px; top: 0; width: 1184px; height: 76px; display: flex; align-items: center; gap: 14px">
<span style="font: 400 26px 'Archivo Black', sans-serif; letter-spacing: 0.02em; text-shadow: 2px 2px 0 {{pink}}">SOMA</span>
<span style="font: 400 14px 'Courier Prime', monospace; color: #3255A4">a zine about what’s on your screen</span>
<span style="flex: 1"></span>
<button type="button" style="height: 44px; padding: 0 16px; display: flex; align-items: center; gap: 8px; background: #F1EEE6; border: 2.5px solid #3255A4; border-radius: 6px; font: 700 14px 'Archivo', sans-serif; color: #3255A4">Explorations<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg></button>
<button type="button" aria-label="More" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; background: #F1EEE6; border: 2.5px solid #3255A4; border-radius: 6px; color: #3255A4"><svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="5" cy="12" r="2"></circle><circle cx="12" cy="12" r="2"></circle><circle cx="19" cy="12" r="2"></circle></svg></button>
</header>

<h1 style="position: absolute; left: 48px; top: 100px; width: 340px; margin: 0; font: 400 46px/1.02 'Archivo Black', sans-serif; letter-spacing: -0.01em; text-shadow: 3px 3px 0 {{pink}}">Fewest edges or lowest cost?</h1>

<div style="position: absolute; left: 48px; top: 292px; width: 92px; height: 92px; box-sizing: border-box; border: 2.5px solid #3255A4; border-radius: 46px; transform: rotate(-8deg); display: flex; flex-direction: column; align-items: center; justify-content: center"><span style="font: 700 26px 'Courier Prime', monospace; line-height: 1">03</span><span style="font: 400 12px 'Courier Prime', monospace">of 05</span></div>
<p style="position: absolute; left: 156px; top: 290px; width: 236px; margin: 0; font: 600 21px/1.3 'Archivo', sans-serif; color: #1E1B4B">Plot twist: through B, Goal drops from 10 to 3.</p>

<div style="position: absolute; left: 48px; top: 428px; width: 340px; display: flex; flex-direction: column; gap: 12px">
<button type="button" aria-pressed="true" style="height: 56px; padding: 0 18px; display: flex; align-items: center; justify-content: space-between; background: {{pink}}; border: 2.5px solid #1E1B4B; border-radius: 8px; box-shadow: 4px 4px 0 #3255A4; color: #1E1B4B; font: 700 16px 'Archivo', sans-serif">Lowest cost · Dijkstra<span style="font: 700 22px 'Courier Prime', monospace">3</span></button>
<button type="button" aria-pressed="false" style="height: 56px; padding: 0 18px; display: flex; align-items: center; justify-content: space-between; background: #F1EEE6; border: 2.5px solid #3255A4; border-radius: 8px; color: #3255A4; font: 600 16px 'Archivo', sans-serif">Fewest edges · BFS<span style="font: 700 22px 'Courier Prime', monospace">10</span></button>
</div>

<section aria-label="Explanation" style="position: absolute; left: 420px; top: 96px; width: 812px; height: 470px; box-sizing: border-box; background: #FBF8F1; border: 2.5px solid #3255A4; transform: rotate(0.5deg)">
<span aria-hidden="true" style="position: absolute; left: -22px; top: -14px; width: 96px; height: 28px; background: {{pink}}; opacity: 0.55; transform: rotate(-24deg)"></span>
<span aria-hidden="true" style="position: absolute; left: 736px; top: -14px; width: 96px; height: 28px; background: {{pink}}; opacity: 0.55; transform: rotate(22deg)"></span>
<div role="img" aria-label="Weighted graph, step 3 of 5. S and A settled; B is the current node; through B, Goal's cost drops from 10 to 3; C and Goal waiting; Unconnected X unreached." style="position: absolute; left: 24px; top: 28px; width: 760px; height: 410px">
<svg width="760" height="410" viewBox="0 0 760 410" aria-hidden="true" style="position: absolute; left: 0; top: 0">
<defs>
<marker id="zn-b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#3255A4"></path></marker>
<marker id="zn-p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="{{pink}}"></path></marker>
</defs>
<g stroke="#3255A4" stroke-width="2.5" fill="none" stroke-linecap="round">
<line x1="142.7" y1="171" x2="235.6" y2="119.9" marker-end="url(#zn-b)"></line>
<line x1="348" y1="90" x2="450" y2="90" marker-end="url(#zn-b)"></line>
<line x1="147.9" y1="222.4" x2="340.3" y2="296.9" marker-end="url(#zn-b)"></line>
<line x1="457.8" y1="295.2" x2="620.3" y2="225.6" marker-end="url(#zn-b)"></line>
<line x1="148" y1="200" x2="620" y2="200" marker-end="url(#zn-b)"></line>
</g>
<line x1="558" y1="122" x2="636.4" y2="172.8" stroke="#3255A4" stroke-width="5" stroke-linecap="round"></line>
<line x1="555" y1="119.1" x2="633.4" y2="169.8" stroke="{{pink}}" stroke-width="5" stroke-linecap="round" marker-end="url(#zn-p)"></line>
</svg>

<div style="position: absolute; left: 176px; top: 134px; width: 28px; height: 24px; box-sizing: border-box; display: flex; align-items: center; justify-content: center; background: #FBF8F1; border: 2px solid #3255A4; border-radius: 4px; font: 700 14px 'Courier Prime', monospace">1</div>
<div style="position: absolute; left: 386px; top: 78px; width: 28px; height: 24px; box-sizing: border-box; display: flex; align-items: center; justify-content: center; background: #FBF8F1; border: 2px solid #3255A4; border-radius: 4px; font: 700 14px 'Courier Prime', monospace">1</div>
<div style="position: absolute; left: 579px; top: 132px; width: 32px; height: 26px; box-sizing: border-box; display: flex; align-items: center; justify-content: center; background: {{pink}}; border: 2px solid #1E1B4B; border-radius: 4px; color: #1E1B4B; font: 700 14px 'Courier Prime', monospace">1</div>
<div style="position: absolute; left: 231px; top: 248px; width: 28px; height: 24px; box-sizing: border-box; display: flex; align-items: center; justify-content: center; background: #FBF8F1; border: 2px solid #3255A4; border-radius: 4px; font: 700 14px 'Courier Prime', monospace">2</div>
<div style="position: absolute; left: 526px; top: 248px; width: 28px; height: 24px; box-sizing: border-box; display: flex; align-items: center; justify-content: center; background: #FBF8F1; border: 2px solid #3255A4; border-radius: 4px; font: 700 14px 'Courier Prime', monospace">6</div>
<div style="position: absolute; left: 367px; top: 188px; width: 36px; height: 24px; box-sizing: border-box; display: flex; align-items: center; justify-content: center; background: #FBF8F1; border: 2px solid #3255A4; border-radius: 4px; font: 700 14px 'Courier Prime', monospace">10</div>

<div style="position: absolute; left: 34px; top: 172px; width: 112px; height: 56px; box-sizing: border-box; border-radius: 10px; background: #3255A4; color: #FBF8F1; display: flex; align-items: center; justify-content: center; text-align: center"><span><b style="font: 400 18px 'Archivo Black', sans-serif">S</b><br><span style="font: 700 13px 'Courier Prime', monospace">0</span></span></div>
<div style="position: absolute; left: 234px; top: 62px; width: 112px; height: 56px; box-sizing: border-box; border-radius: 10px; background: #3255A4; color: #FBF8F1; display: flex; align-items: center; justify-content: center; text-align: center"><span><b style="font: 400 18px 'Archivo Black', sans-serif">A</b><br><span style="font: 700 13px 'Courier Prime', monospace">1</span></span></div>
<div style="position: absolute; left: 454px; top: 62px; width: 112px; height: 56px; box-sizing: border-box; border-radius: 10px; background: {{pink}}; border: 2.5px solid #1E1B4B; box-shadow: 4px 4px 0 #3255A4; color: #1E1B4B; display: flex; align-items: center; justify-content: center; text-align: center"><span><b style="font: 400 18px 'Archivo Black', sans-serif">B</b><br><span style="font: 700 13px 'Courier Prime', monospace">2</span></span></div>
<div style="position: absolute; left: 624px; top: 172px; width: 112px; height: 56px; box-sizing: border-box; border-radius: 10px; background-color: #FBF8F1; background-image: radial-gradient(#FFB3DC 1.3px, transparent 1.6px); background-size: 6px 6px; border: 2.5px solid #3255A4; color: #1E1B4B; display: flex; align-items: center; justify-content: center; text-align: center"><span><b style="font: 400 17px 'Archivo Black', sans-serif">Goal</b><br><span style="font: 700 13px 'Courier Prime', monospace"><s>10</s> 3</span></span></div>
<div style="position: absolute; left: 344px; top: 292px; width: 112px; height: 56px; box-sizing: border-box; border-radius: 10px; background-color: #FBF8F1; background-image: radial-gradient(#FFB3DC 1.3px, transparent 1.6px); background-size: 6px 6px; border: 2.5px solid #3255A4; color: #1E1B4B; display: flex; align-items: center; justify-content: center; text-align: center"><span><b style="font: 400 18px 'Archivo Black', sans-serif">C</b><br><span style="font: 700 13px 'Courier Prime', monospace">2</span></span></div>
<div style="position: absolute; left: 20px; top: 316px; width: 160px; height: 56px; box-sizing: border-box; border-radius: 10px; border: 2.5px dashed #3255A4; display: flex; align-items: center; justify-content: center; text-align: center"><span><b style="font-size: 15px; font-weight: 700">Unconnected X</b><br><span style="font: 400 13px 'Courier Prime', monospace">unreached</span></span></div>

<div style="position: absolute; left: 600px; top: 252px; padding: 6px 12px; background: #FFE95C; border: 2px solid #1E1B4B; transform: rotate(-6deg); font: 700 14px 'Courier Prime', monospace; color: #1E1B4B">10 → 3!</div>

<div style="position: absolute; left: 470px; top: 368px; display: flex; align-items: center; gap: 8px; font: 700 14px 'Courier Prime', monospace">waiting:<span style="padding: 3px 10px; border: 2px solid #3255A4; border-radius: 4px">C 2</span><span style="padding: 3px 10px; border: 2px solid #3255A4; border-radius: 4px">Goal 3</span></div>
</div>
</section>

<div style="position: absolute; left: 420px; top: 586px; width: 812px; height: 56px; display: flex; align-items: center; gap: 10px">
<div role="group" aria-label="View" style="display: flex; border: 2.5px solid #3255A4; border-radius: 6px; overflow: hidden">
<button type="button" aria-pressed="true" style="height: 44px; padding: 0 16px; background: #3255A4; border: 0; color: #FBF8F1; font: 700 14px 'Archivo', sans-serif">2D</button>
<button type="button" aria-pressed="false" style="height: 44px; padding: 0 16px; background: transparent; border: 0; color: #3255A4; font: 600 14px 'Archivo', sans-serif">3D</button>
</div>
<button type="button" style="height: 44px; padding: 0 12px; display: flex; align-items: center; gap: 6px; background: transparent; border: 2px dashed #3255A4; border-radius: 6px; color: #3255A4; font: 700 13px 'Courier Prime', monospace">checked by soma ✓</button>
<span style="flex: 1"></span>
<button type="button" aria-label="Previous step" style="width: 48px; height: 48px; display: flex; align-items: center; justify-content: center; background: #F1EEE6; border: 2.5px solid #3255A4; border-radius: 24px; color: #3255A4"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg></button>
<button type="button" aria-label="Play explanation" style="width: 56px; height: 56px; display: flex; align-items: center; justify-content: center; background: {{pink}}; border: 2.5px solid #1E1B4B; border-radius: 28px; box-shadow: 3px 3px 0 #3255A4; color: #1E1B4B"><svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5v14l11-7z"></path></svg></button>
<button type="button" aria-label="Next step" style="width: 48px; height: 48px; display: flex; align-items: center; justify-content: center; background: #F1EEE6; border: 2.5px solid #3255A4; border-radius: 24px; color: #3255A4"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg></button>
</div>

<form style="position: absolute; left: 48px; top: 690px; width: 1184px; height: 64px; display: flex; gap: 12px; margin: 0">
<label for="zn-ask" class="sr">Ask about this explanation</label>
<input id="zn-ask" type="text" placeholder="Ask Soma anything about this page…" style="flex: 1; height: 60px; box-sizing: border-box; padding: 0 20px; background: #FBF8F1; border: 2.5px solid #3255A4; border-radius: 8px; font: 500 17px 'Archivo', sans-serif; color: #1E1B4B">
<button type="button" aria-label="Record a question" style="width: 60px; height: 60px; display: flex; align-items: center; justify-content: center; background: #FBF8F1; border: 2.5px solid #3255A4; border-radius: 8px; color: #3255A4"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><rect x="9" y="3" width="6" height="12" rx="3"></rect><path d="M5 11a7 7 0 0 0 14 0M12 18v3"></path></svg></button>
<button type="submit" style="height: 60px; padding: 0 32px; background: #3255A4; border: 2.5px solid #1E1B4B; border-radius: 8px; box-shadow: 4px 4px 0 {{pink}}; color: #FBF8F1; font: 400 18px 'Archivo Black', sans-serif; letter-spacing: 0.02em">ASK</button>
</form>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"pink":{"editor":"color","default":"#FF48B0","options":["#FF48B0","#FF7A3D","#00A95C"]},"$preview":{"width":1280,"height":800}}'>
class Component extends DCLogic {
  renderVals() {
    return { pink: this.props.pink ?? '#FF48B0' };
  }
}
</script>
</body>
</html>
