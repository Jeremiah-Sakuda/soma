name: Verify Soma
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Verify Firebase loads under serverless module restrictions
        run: node --no-experimental-require-module -e "require('firebase-admin/auth')"
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Verify browser runtime in an isolated production trace
        run: npm run check:browser-artifact
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-results
          path: test-results/
          retention-days: 7
