<!doctype html>

<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&amp;family=IBM+Plex+Mono:wght@400;500;600&amp;display=swap">
<style>

<div style="width: 1280px; height: 800px; box-sizing: border-box; background: #E7E5DF; color: #1D1C1A; font-family: 'Instrument Sans', system-ui, sans-serif; display: flex; flex-direction: column; gap: 16px; padding: 0 32px 32px">

<header style="height: 64px; display: flex; align-items: center; gap: 16px">
<div style="display: flex; align-items: center; gap: 10px">
<span style="width: 22px; height: 22px; border: 2px solid #1D1C1A; border-radius: 4px; box-sizing: border-box; display: flex; align-items: center; justify-content: center"><span style="width: 8px; height: 8px; background: {{accent}}; border-radius: 1px"></span></span>
<span style="font-size: 20px; font-weight: 700; letter-spacing: -0.02em">soma</span>
</div>
<span style="width: 1px; height: 20px; background: #C9C5BB"></span>
<h1 style="margin: 0; font-size: 16px; font-weight: 500; color: #3D3C38">Fewest edges or lowest cost?</h1>
<span style="flex: 1"></span>
<button type="button" style="height: 44px; padding: 0 14px; display: flex; align-items: center; gap: 8px; background: transparent; border: 1px solid #C9C5BB; border-radius: 6px; font: inherit; font-size: 14px; color: #1D1C1A">Explorations<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg></button>
<button type="button" aria-label="More" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; background: transparent; border: 1px solid #C9C5BB; border-radius: 6px; color: #1D1C1A"><svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="5" cy="12" r="1.8"></circle><circle cx="12" cy="12" r="1.8"></circle><circle cx="19" cy="12" r="1.8"></circle></svg></button>
</header>

<main style="height: 520px; display: flex; gap: 24px">

<section aria-label="Explanation" style="position: relative; width: 880px; height: 520px; box-sizing: border-box; background-color: #FBFAF6; background-image: radial-gradient(#DAD6CC 1px, transparent 1.2px); background-size: 24px 24px; border: 1px solid #D3D0C6; border-radius: 6px">

<span aria-hidden="true" style="position: absolute; left: 44px; top: 20px; width: 12px; height: 12px; border-left: 1.5px solid #8A877E; border-top: 1.5px solid #8A877E"></span>
<span aria-hidden="true" style="position: absolute; left: 824px; top: 20px; width: 12px; height: 12px; border-right: 1.5px solid #8A877E; border-top: 1.5px solid #8A877E"></span>

<line x1="148" y1="200" x2="620" y2="200" marker-end="url(#lt-ink)"></line>
</g>
<line x1="555" y1="119.1" x2="633.4" y2="169.8" stroke="{{accent}}" stroke-width="3" marker-end="url(#lt-acc)"></line>
</svg>

<div style="position: absolute; left: 176px; top: 134px; width: 28px; height: 22px; box-sizing: border-box; display: flex; align-items: center; justify-content: center; background: #FBFAF6; border: 1px solid #3B3A36; border-radius: 5px; font: 600 12px 'IBM Plex Mono', monospace">1</div>
<div style="position: absolute; left: 386px; top: 79px; width: 28px; height: 22px; box-sizing: border-box; display: flex; align-items: center; justify-content: center; background: #FBFAF6; border: 1px solid #3B3A36; border-radius: 5px; font: 600 12px 'IBM Plex Mono', monospace">1</div>
<div style="position: absolute; left: 581px; top: 134px; width: 28px; height: 22px; box-sizing: border-box; display: flex; align-items: center; justify-content: center; background: #FFFFFF; border: 2px solid {{accent}}; color: {{accent}}; border-radius: 5px; font: 600 12px 'IBM Plex Mono', monospace">1</div>
<div style="position: absolute; left: 231px; top: 249px; width: 28px; height: 22px; box-sizing: border-box; display: flex; align-items: center; justify-content: center; background: #FBFAF6; border: 1px solid #3B3A36; border-radius: 5px; font: 600 12px 'IBM Plex Mono', monospace">2</div>
<div style="position: absolute; left: 526px; top: 249px; width: 28px; height: 22px; box-sizing: border-box; display: flex; align-items: center; justify-content: center; background: #FBFAF6; border: 1px solid #3B3A36; border-radius: 5px; font: 600 12px 'IBM Plex Mono', monospace">6</div>

<div style="position: absolute; left: 234px; top: 62px; width: 112px; height: 56px; box-sizing: border-box; border-radius: 28px; background: #1D1C1A; color: #FBFAF6; display: flex; align-items: center; justify-content: center; text-align: center"><span><b style="font-size: 16px">A</b><br><span style="font: 500 13px 'IBM Plex Mono', monospace">1</span></span></div>
<div style="position: absolute; left: 454px; top: 62px; width: 112px; height: 56px; box-sizing: border-box; border-radius: 28px; background: {{accent}}; color: #FFFFFF; display: flex; align-items: center; justify-content: center; text-align: center; box-shadow: 0 0 0 4px #FBFAF6, 0 0 0 6px {{accent}}"><span><b style="font-size: 16px">B</b><br><span style="font: 500 13px 'IBM Plex Mono', monospace">2</span></span></div>
<div style="position: absolute; left: 624px; top: 172px; width: 112px; height: 56px; box-sizing: border-box; border-radius: 28px; background: #FFFFFF; border: 2px solid #1D1C1A; display: flex; align-items: center; justify-content: center; text-align: center"><span><b style="font-size: 16px">Goal</b><br><span style="font: 500 13px 'IBM Plex Mono', monospace"><s style="color: #6B6860">10</s> 3</span></span></div>

<div style="position: absolute; left: 20px; top: 316px; width: 160px; height: 56px; box-sizing: border-box; border-radius: 28px; border: 2px dashed #8A877E; color: #55534D; display: flex; align-items: center; justify-content: center; text-align: center"><span><b style="font-size: 15px">Unconnected X</b><br><span style="font-size: 13px">unreached</span></span></div>

<div style="position: absolute; left: 470px; top: 366px; height: 32px; display: flex; align-items: center; gap: 8px; font-size: 13px; color: #55534D">Waiting<span style="height: 26px; padding: 0 10px; display: flex; align-items: center; border: 1px solid #3B3A36; border-radius: 13px; background: #FFFFFF; color: #1D1C1A; font: 500 12px 'IBM Plex Mono', monospace">C 2</span><span style="height: 26px; padding: 0 10px; display: flex; align-items: center; border: 1px solid #3B3A36; border-radius: 13px; background: #FFFFFF; color: #1D1C1A; font: 500 12px 'IBM Plex Mono', monospace">Goal 3</span></div>
</div>

<div style="position: absolute; left: 60px; top: 466px; width: 760px; height: 44px; display: flex; align-items: center; gap: 8px">
<button type="button" aria-pressed="true" style="height: 44px; padding: 0 16px; display: flex; align-items: center; gap: 8px; background: {{accent}}; color: #FFFFFF; border: 0; border-radius: 22px; font: inherit; font-size: 14px; font-weight: 600">Dijkstra<span style="font: 600 14px 'IBM Plex Mono', monospace">3</span></button>
<button type="button" aria-pressed="false" style="height: 44px; padding: 0 16px; display: flex; align-items: center; gap: 8px; background: transparent; color: #1D1C1A; border: 1px solid #B5B1A6; border-radius: 22px; font: inherit; font-size: 14px; font-weight: 500">BFS<span style="font: 500 14px 'IBM Plex Mono', monospace">10</span></button>
<span style="flex: 1"></span>
<div role="group" aria-label="View" style="display: flex; border: 1px solid #B5B1A6; border-radius: 6px; overflow: hidden">
<button type="button" aria-pressed="true" style="height: 42px; padding: 0 14px; background: #1D1C1A; color: #FBFAF6; border: 0; font: inherit; font-size: 13px; font-weight: 600">2D</button>
<button type="button" aria-pressed="false" style="height: 42px; padding: 0 14px; background: transparent; color: #1D1C1A; border: 0; font: inherit; font-size: 13px">3D</button>
</div>
<button type="button" style="height: 44px; padding: 0 10px; display: flex; align-items: center; gap: 6px; background: transparent; border: 0; font: inherit; font-size: 13px; color: #55534D">Checked by Soma<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 11v5M12 8h.01" stroke-linecap="round"></path></svg></button>
</div>

<aside aria-label="Source" style="width: 312px; display: flex; flex-direction: column; gap: 16px">
<div style="background: #FBFAF6; border: 1px solid #D3D0C6; border-radius: 6px; padding: 20px; display: flex; flex-direction: column; gap: 14px">
<p style="margin: 0; font-size: 12px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: #55534D">Lifted from your screen</p>
<div style="position: relative; height: 164px; background: #FFFFFF; border: 1px solid #D3D0C6; border-radius: 4px; transform: rotate(-1.2deg)">
<svg width="270" height="164" viewBox="0 0 270 164" aria-hidden="true" style="position: absolute; left: 0; top: 0">
<rect x="16" y="14" width="120" height="8" rx="2" fill="#D9D6CD"></rect>
<rect x="16" y="28" width="80" height="6" rx="2" fill="#E6E3DB"></rect>
<g stroke="#A9A598" stroke-width="1.5" fill="#FFFFFF">
<line x1="50" y1="100" x2="110" y2="66"></line><line x1="110" y1="66" x2="180" y2="66"></line><line x1="180" y1="66" x2="230" y2="100"></line><line x1="50" y1="100" x2="230" y2="100"></line><line x1="50" y1="100" x2="140" y2="134"></line><line x1="140" y1="134" x2="230" y2="100"></line>
<circle cx="50" cy="100" r="11"></circle><circle cx="110" cy="66" r="11"></circle><circle cx="180" cy="66" r="11"></circle><circle cx="230" cy="100" r="11"></circle><circle cx="140" cy="134" r="11"></circle>
</g>
</svg>
</div>
<p style="margin: 0; font-size: 14px; color: #3D3C38">Lecture slide · captured just now</p>
<div style="display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-top: 12px; border-top: 1px solid #E2DFD7">
<span id="overlay-label" style="font-size: 14px; font-weight: 500">Lay it over the slide</span>
<button type="button" role="switch" aria-checked="false" aria-labelledby="overlay-label" style="width: 52px; height: 32px; padding: 3px; box-sizing: border-box; display: flex; align-items: center; background: #D9D6CD; border: 0; border-radius: 16px"><span style="width: 26px; height: 26px; background: #FFFFFF; border-radius: 13px"></span></button>
</div>
</div>
</aside>
</main>

<div style="height: 64px; display: flex; align-items: center; gap: 12px; padding: 0 12px; background: #FBFAF6; border: 1px solid #D3D0C6; border-radius: 6px">
<button type="button" aria-label="Previous step" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; background: transparent; border: 1px solid #C9C5BB; border-radius: 22px; color: #1D1C1A"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg></button>
<button type="button" aria-label="Play explanation" style="width: 48px; height: 48px; display: flex; align-items: center; justify-content: center; background: {{accent}}; border: 0; border-radius: 24px; color: #FFFFFF"><svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5v14l11-7z"></path></svg></button>
<button type="button" aria-label="Next step" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; background: transparent; border: 1px solid #C9C5BB; border-radius: 22px; color: #1D1C1A"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg></button>
<div aria-label="Step 3 of 5" role="img" style="display: flex; gap: 4px; padding: 0 8px"><span style="width: 18px; height: 4px; background: #1D1C1A"></span><span style="width: 18px; height: 4px; background: #1D1C1A"></span><span style="width: 18px; height: 4px; background: {{accent}}"></span><span style="width: 18px; height: 4px; background: #D3D0C6"></span><span style="width: 18px; height: 4px; background: #D3D0C6"></span></div>
<p style="margin: 0; flex: 1; font-size: 17px; font-weight: 500">Going through B, Goal <mark style="background: #FFE45C; color: #1D1C1A; padding: 0 4px">drops from 10 to 3</mark>.</p>
<button type="button" style="height: 44px; padding: 0 14px; background: transparent; border: 1px solid #C9C5BB; border-radius: 22px; font: inherit; font-size: 14px; color: #1D1C1A">Predict next</button>
</div>

<form style="height: 56px; display: flex; gap: 12px; margin: 0">
<label for="lt-ask" class="sr">Ask about this explanation</label>

<button type="button" aria-label="Record a question" style="width: 56px; height: 56px; display: flex; align-items: center; justify-content: center; background: #FBFAF6; border: 1px solid #B5B1A6; border-radius: 6px; color: #1D1C1A"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="9" y="3" width="6" height="12" rx="3"></rect><path d="M5 11a7 7 0 0 0 14 0M12 18v3"></path></svg></button>
<button type="submit" style="height: 56px; padding: 0 28px; background: #1D1C1A; color: #FBFAF6; border: 0; border-radius: 6px; font: inherit; font-size: 16px; font-weight: 600">Ask</button>
</form>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#2443E8","options":["#2443E8","#E8452C","#0F7B5F"]},"$preview":{"width":1280,"height":800}}'>

  renderVals() {
