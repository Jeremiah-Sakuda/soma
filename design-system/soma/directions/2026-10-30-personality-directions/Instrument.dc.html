<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Soma · Instrument</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&amp;family=Martian+Mono:wght@400;500;700&amp;display=swap">
<style>
body{margin:0}
a{color:#111111}a:hover{color:#FF5A00}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
</style>
</helmet>
<div style="width: 1280px; height: 800px; box-sizing: border-box; padding: 32px; background: #D6D5CF; font-family: 'Inter Tight', system-ui, sans-serif; color: #111111">
<div style="width: 1216px; height: 736px; box-sizing: border-box; padding: 24px; background: #ECEBE6; border: 1px solid #C4C3BC; border-radius: 22px; box-shadow: inset 0 -3px 0 #D2D1CA; display: flex; flex-direction: column; gap: 16px">

<header style="height: 48px; display: flex; align-items: center; gap: 16px">
<span style="display: flex; align-items: center; gap: 8px; font: 700 18px 'Martian Mono', monospace; letter-spacing: 0.04em">SOMA<span style="width: 10px; height: 10px; border-radius: 5px; background: {{accent}}"></span></span>
<span style="font: 500 11px 'Martian Mono', monospace; letter-spacing: 0.08em; color: #4A4945">EX-1 EXPLORER</span>
<span style="width: 1px; height: 24px; background: #C4C3BC"></span>
<h1 style="margin: 0; font-size: 17px; font-weight: 600">Fewest edges or lowest cost?</h1>
<span style="flex: 1"></span>
<button type="button" style="height: 44px; padding: 0 16px; display: flex; align-items: center; gap: 8px; background: #F7F6F2; border: 1px solid #C4C3BC; border-radius: 10px; box-shadow: 0 2px 0 #C4C3BC; font: 500 12px 'Martian Mono', monospace; letter-spacing: 0.06em; color: #111111">EXPLORATIONS<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg></button>
<button type="button" aria-label="More" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; background: #F7F6F2; border: 1px solid #C4C3BC; border-radius: 10px; box-shadow: 0 2px 0 #C4C3BC; color: #111111"><svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="5" cy="12" r="1.8"></circle><circle cx="12" cy="12" r="1.8"></circle><circle cx="19" cy="12" r="1.8"></circle></svg></button>
</header>

<main style="height: 452px; display: flex; gap: 16px">
<div style="width: 812px; height: 452px; box-sizing: border-box; padding: 6px; background: #C9C8C1; border-radius: 16px">
<div role="img" aria-label="Weighted graph on the display, step 3 of 5. S, A and B settled; Goal's cost drops from 10 to 3 through B; C and Goal waiting; Unconnected X unreached." style="position: relative; width: 800px; height: 440px; box-sizing: border-box; background-color: #141414; background-image: linear-gradient(#1F1F1F 1px, transparent 1px), linear-gradient(90deg, #1F1F1F 1px, transparent 1px); background-size: 20px 20px; border-radius: 11px; overflow: hidden">
<div style="position: absolute; left: 20px; top: 15px; width: 760px; height: 410px">
<svg width="760" height="410" viewBox="0 0 760 410" aria-hidden="true" style="position: absolute; left: 0; top: 0">
<defs>
<marker id="in-w" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#BDBDB6"></path></marker>
<marker id="in-o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="{{accent}}"></path></marker>
</defs>
<g stroke="#BDBDB6" stroke-width="2" fill="none">
<line x1="142.7" y1="171" x2="235.6" y2="119.9" marker-end="url(#in-w)"></line>
<line x1="348" y1="90" x2="450" y2="90" marker-end="url(#in-w)"></line>
<line x1="147.9" y1="222.4" x2="340.3" y2="296.9" marker-end="url(#in-w)"></line>
<line x1="457.8" y1="295.2" x2="620.3" y2="225.6" marker-end="url(#in-w)"></line>
<line x1="148" y1="200" x2="620" y2="200" marker-end="url(#in-w)"></line>
</g>
<line x1="555" y1="119.1" x2="633.4" y2="169.8" stroke="{{accent}}" stroke-width="3" marker-end="url(#in-o)"></line>
</svg>
<div style="position: absolute; left: 176px; top: 134px; width: 28px; height: 22px; box-sizing: border-box; display: flex; align-items: center; justify-content: center; background: #141414; border: 1px solid #BDBDB6; border-radius: 4px; color: #F2F1EC; font: 500 11px 'Martian Mono', monospace">1</div>
<div style="position: absolute; left: 386px; top: 79px; width: 28px; height: 22px; box-sizing: border-box; display: flex; align-items: center; justify-content: center; background: #141414; border: 1px solid #BDBDB6; border-radius: 4px; color: #F2F1EC; font: 500 11px 'Martian Mono', monospace">1</div>
<div style="position: absolute; left: 581px; top: 134px; width: 28px; height: 22px; box-sizing: border-box; display: flex; align-items: center; justify-content: center; background: {{accent}}; border-radius: 4px; color: #111111; font: 700 11px 'Martian Mono', monospace">1</div>
<div style="position: absolute; left: 231px; top: 249px; width: 28px; height: 22px; box-sizing: border-box; display: flex; align-items: center; justify-content: center; background: #141414; border: 1px solid #BDBDB6; border-radius: 4px; color: #F2F1EC; font: 500 11px 'Martian Mono', monospace">2</div>
<div style="position: absolute; left: 526px; top: 249px; width: 28px; height: 22px; box-sizing: border-box; display: flex; align-items: center; justify-content: center; background: #141414; border: 1px solid #BDBDB6; border-radius: 4px; color: #F2F1EC; font: 500 11px 'Martian Mono', monospace">6</div>
<div style="position: absolute; left: 367px; top: 189px; width: 36px; height: 22px; box-sizing: border-box; display: flex; align-items: center; justify-content: center; background: #141414; border: 1px solid #BDBDB6; border-radius: 4px; color: #F2F1EC; font: 500 11px 'Martian Mono', monospace">10</div>

<div style="position: absolute; left: 34px; top: 172px; width: 112px; height: 56px; box-sizing: border-box; border-radius: 12px; background: #F2F1EC; color: #111111; display: flex; align-items: center; justify-content: center; text-align: center; font-family: 'Martian Mono', monospace"><span><b style="font-size: 15px">S</b><br><span style="font-size: 12px">0</span></span></div>
<div style="position: absolute; left: 234px; top: 62px; width: 112px; height: 56px; box-sizing: border-box; border-radius: 12px; background: #F2F1EC; color: #111111; display: flex; align-items: center; justify-content: center; text-align: center; font-family: 'Martian Mono', monospace"><span><b style="font-size: 15px">A</b><br><span style="font-size: 12px">1</span></span></div>
<div style="position: absolute; left: 454px; top: 62px; width: 112px; height: 56px; box-sizing: border-box; border-radius: 12px; background: {{accent}}; color: #111111; display: flex; align-items: center; justify-content: center; text-align: center; font-family: 'Martian Mono', monospace"><span><b style="font-size: 15px">B</b><br><span style="font-size: 12px">2</span></span></div>
<div style="position: absolute; left: 624px; top: 172px; width: 112px; height: 56px; box-sizing: border-box; border-radius: 12px; border: 2px solid #F2F1EC; color: #F2F1EC; display: flex; align-items: center; justify-content: center; text-align: center; font-family: 'Martian Mono', monospace"><span><b style="font-size: 15px">GOAL</b><br><span style="font-size: 12px"><s style="color: #8C8C86">10</s> 3</span></span></div>
<div style="position: absolute; left: 344px; top: 292px; width: 112px; height: 56px; box-sizing: border-box; border-radius: 12px; border: 2px solid #F2F1EC; color: #F2F1EC; display: flex; align-items: center; justify-content: center; text-align: center; font-family: 'Martian Mono', monospace"><span><b style="font-size: 15px">C</b><br><span style="font-size: 12px">2</span></span></div>
<div style="position: absolute; left: 20px; top: 316px; width: 160px; height: 56px; box-sizing: border-box; border-radius: 12px; border: 2px dashed #6E6E69; color: #B5B5AF; display: flex; align-items: center; justify-content: center; text-align: center; font-family: 'Martian Mono', monospace"><span><b style="font-size: 12px">UNCONNECTED X</b><br><span style="font-size: 11px">unreached</span></span></div>

<div style="position: absolute; left: 470px; top: 368px; display: flex; align-items: center; gap: 8px; font: 500 11px 'Martian Mono', monospace; letter-spacing: 0.06em; color: #B5B5AF">QUEUE<span style="padding: 4px 10px; border: 1px solid #F2F1EC; border-radius: 4px; color: #F2F1EC">C 2</span><span style="padding: 4px 10px; border: 1px solid #F2F1EC; border-radius: 4px; color: #F2F1EC">GOAL 3</span></div>
</div>
</div>
</div>

<aside style="width: 340px; display: flex; flex-direction: column; gap: 16px">
<div style="display: flex; gap: 12px">
<button type="button" aria-pressed="true" style="flex: 1; height: 108px; box-sizing: border-box; padding: 12px; display: flex; flex-direction: column; justify-content: space-between; align-items: flex-start; background: #F7F6F2; border: 1px solid #C4C3BC; border-radius: 12px; box-shadow: 0 3px 0 #C4C3BC; text-align: left">
<span style="display: flex; align-items: center; gap: 6px; font: 500 11px 'Martian Mono', monospace; letter-spacing: 0.06em; color: #4A4945"><span style="width: 8px; height: 8px; border-radius: 4px; background: {{accent}}"></span>DIJKSTRA</span>
<span style="width: 100%; box-sizing: border-box; padding: 6px 10px; background: #141414; border-radius: 6px; color: {{accent}}; font: 700 30px 'Martian Mono', monospace; text-align: right">03</span>
</button>
<button type="button" aria-pressed="false" style="flex: 1; height: 108px; box-sizing: border-box; padding: 12px; display: flex; flex-direction: column; justify-content: space-between; align-items: flex-start; background: #F7F6F2; border: 1px solid #C4C3BC; border-radius: 12px; box-shadow: 0 3px 0 #C4C3BC; text-align: left">
<span style="display: flex; align-items: center; gap: 6px; font: 500 11px 'Martian Mono', monospace; letter-spacing: 0.06em; color: #4A4945"><span style="width: 8px; height: 8px; border-radius: 4px; background: #C4C3BC"></span>BFS</span>
<span style="width: 100%; box-sizing: border-box; padding: 6px 10px; background: #141414; border-radius: 6px; color: #8C8C86; font: 700 30px 'Martian Mono', monospace; text-align: right">10</span>
</button>
</div>

<div style="padding: 16px; background: #F7F6F2; border: 1px solid #C4C3BC; border-radius: 12px; display: flex; flex-direction: column; gap: 12px">
<div style="display: flex; justify-content: space-between; align-items: baseline">
<label for="in-fader" style="font: 500 11px 'Martian Mono', monospace; letter-spacing: 0.06em; color: #4A4945">EDGE B → GOAL</label>
<span style="font: 700 20px 'Martian Mono', monospace">1</span>
</div>
<input id="in-fader" type="range" min="0" max="12" step="1" value="1" style="width: 100%; height: 44px; margin: 0; accent-color: {{accent}}">
<p style="margin: 0; font-size: 14px; color: #3A3935">Slide it. At 6 this route ties the one through C; above 6, C's route wins.</p>
</div>

<div style="display: flex; gap: 12px; align-items: stretch">
<div role="group" aria-label="View" style="flex: 1; display: flex; padding: 4px; gap: 4px; background: #C9C8C1; border-radius: 12px">
<button type="button" aria-pressed="true" style="flex: 1; height: 44px; background: #F7F6F2; border: 0; border-radius: 9px; box-shadow: 0 2px 0 #A9A8A1; font: 700 12px 'Martian Mono', monospace; color: #111111">2D</button>
<button type="button" aria-pressed="false" style="flex: 1; height: 44px; background: transparent; border: 0; border-radius: 9px; font: 500 12px 'Martian Mono', monospace; color: #3A3935">3D</button>
</div>
<button type="button" style="flex: 1; height: 52px; display: flex; align-items: center; justify-content: center; gap: 8px; background: #F7F6F2; border: 1px solid #C4C3BC; border-radius: 12px; box-shadow: 0 2px 0 #C4C3BC; font: 500 11px 'Martian Mono', monospace; letter-spacing: 0.04em; color: #111111"><span style="width: 8px; height: 8px; border-radius: 4px; background: #2FA35A"></span>CHECKED</button>
</div>
</aside>
</main>

<div style="height: 72px; display: flex; align-items: center; gap: 10px">
<button type="button" aria-label="Previous step" style="width: 56px; height: 56px; display: flex; align-items: center; justify-content: center; background: #F7F6F2; border: 1px solid #C4C3BC; border-radius: 12px; box-shadow: 0 3px 0 #C4C3BC; color: #111111"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg></button>
<button type="button" aria-label="Play explanation" style="width: 56px; height: 56px; display: flex; align-items: center; justify-content: center; background: {{accent}}; border: 0; border-radius: 28px; box-shadow: 0 3px 0 #B84100; color: #111111"><svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5v14l11-7z"></path></svg></button>
<button type="button" aria-label="Next step" style="width: 56px; height: 56px; display: flex; align-items: center; justify-content: center; background: #F7F6F2; border: 1px solid #C4C3BC; border-radius: 12px; box-shadow: 0 3px 0 #C4C3BC; color: #111111"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg></button>
<div role="group" aria-label="Steps" style="display: flex; gap: 6px; padding: 0 10px">
<button type="button" aria-label="Step 1" style="width: 32px; height: 44px; display: flex; flex-direction: column; align-items: center; justify-content: space-between; padding: 6px 0; box-sizing: border-box; background: #F7F6F2; border: 1px solid #C4C3BC; border-radius: 6px"><span style="width: 14px; height: 4px; border-radius: 2px; background: #111111"></span><span style="font: 500 10px 'Martian Mono', monospace; color: #3A3935">1</span></button>
<button type="button" aria-label="Step 2" style="width: 32px; height: 44px; display: flex; flex-direction: column; align-items: center; justify-content: space-between; padding: 6px 0; box-sizing: border-box; background: #F7F6F2; border: 1px solid #C4C3BC; border-radius: 6px"><span style="width: 14px; height: 4px; border-radius: 2px; background: #111111"></span><span style="font: 500 10px 'Martian Mono', monospace; color: #3A3935">2</span></button>
<button type="button" aria-label="Step 3, current" aria-current="step" style="width: 32px; height: 44px; display: flex; flex-direction: column; align-items: center; justify-content: space-between; padding: 6px 0; box-sizing: border-box; background: #F7F6F2; border: 2px solid #111111; border-radius: 6px"><span style="width: 14px; height: 4px; border-radius: 2px; background: {{accent}}"></span><span style="font: 700 10px 'Martian Mono', monospace; color: #111111">3</span></button>
<button type="button" aria-label="Step 4" style="width: 32px; height: 44px; display: flex; flex-direction: column; align-items: center; justify-content: space-between; padding: 6px 0; box-sizing: border-box; background: #F7F6F2; border: 1px solid #C4C3BC; border-radius: 6px"><span style="width: 14px; height: 4px; border-radius: 2px; background: #D2D1CA"></span><span style="font: 500 10px 'Martian Mono', monospace; color: #3A3935">4</span></button>
<button type="button" aria-label="Step 5" style="width: 32px; height: 44px; display: flex; flex-direction: column; align-items: center; justify-content: space-between; padding: 6px 0; box-sizing: border-box; background: #F7F6F2; border: 1px solid #C4C3BC; border-radius: 6px"><span style="width: 14px; height: 4px; border-radius: 2px; background: #D2D1CA"></span><span style="font: 500 10px 'Martian Mono', monospace; color: #3A3935">5</span></button>
</div>
<p style="margin: 0; flex: 1; height: 56px; box-sizing: border-box; padding: 0 18px; display: flex; align-items: center; background: #141414; border-radius: 10px; color: #F2F1EC; font: 500 16px 'Martian Mono', monospace">Through B, Goal drops from 10 to 3.</p>
</div>

<form style="height: 64px; display: flex; gap: 10px; margin: 0">
<label for="in-ask" class="sr">Ask about this explanation</label>
<input id="in-ask" type="text" placeholder="Ask about this…" style="flex: 1; height: 60px; box-sizing: border-box; padding: 0 18px; background: #F7F6F2; border: 1px solid #C4C3BC; border-radius: 12px; font: inherit; font-size: 17px; color: #111111">
<button type="button" aria-label="Record a question" style="width: 60px; height: 60px; display: flex; align-items: center; justify-content: center; background: #F7F6F2; border: 1px solid #C4C3BC; border-radius: 30px; box-shadow: 0 3px 0 #C4C3BC; color: #111111"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><rect x="9" y="3" width="6" height="12" rx="3"></rect><path d="M5 11a7 7 0 0 0 14 0M12 18v3"></path></svg></button>
<button type="submit" style="height: 60px; padding: 0 28px; background: #111111; color: #F7F6F2; border: 0; border-radius: 12px; box-shadow: 0 3px 0 #000000; font: 700 13px 'Martian Mono', monospace; letter-spacing: 0.08em">ASK</button>
</form>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#FF5A00","options":["#FF5A00","#FFB800","#3D7BFF"]},"$preview":{"width":1280,"height":800}}'>
class Component extends DCLogic {
  renderVals() {
    return { accent: this.props.accent ?? '#FF5A00' };
  }
}
</script>
</body>
</html>
